[package]
name = "nsh-compat"
version = "0.1.0"
edition = "2024"
publish = false
description = "The API Native Shell's releases froze, and the checks that hold later checkouts of NSH to it"
license = "Apache-2.0"

# A workspace of its own, also when `cargo xtask compat` checks it out
# inside an NSH checkout's `target/`.
[workspace]

# NSH's crates come from the checkout under test, next to this repository
# (`../nsh`): NSH's CI checks both out side by side, and `cargo xtask compat`
# links its checkout there.
[dependencies]
nsh-core = { path = "../nsh/crates/nsh-core", features = ["declarations"] }
nsh-js = { path = "../nsh/crates/nsh-js" }
nsh-base = { path = "../nsh/crates/nsh-base" }
nsh-engine = { path = "../nsh/crates/nsh-engine" }
crossbeam-channel = "0.5"
log = "0.4"
serde_json = "1"
# The Tailwind record reads the lengths of resolved styles: the version
# nsh-core lays out with.
taffy = { version = "0.15", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid", "block_layout", "content_size"] }
